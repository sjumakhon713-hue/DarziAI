<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6E1F45">
<title>Дарзӣ AI — ёрдамчии дӯзанда</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{--bg:#F4EEE6;--card:#FFFDF9;--ink:#2B2420;--muted:#7A6E66;--line:#E7DED2;--plum:#A3305F;--plum2:#6E1F45;--plumL:#F6E4EC;--saffron:#E0A526;--saffL:#FBF0D6;--teal:#1F7A72;--tealL:#DDF0EC;--red:#C2412D;--redL:#F8E1DC}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,Arial,sans-serif;background:#E6DDD1;color:var(--ink);display:flex;justify-content:center;font-size:15px}
  .phone{width:100%;max-width:440px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}
  header.top{background:linear-gradient(135deg,var(--plum2),var(--plum));color:#fff;padding:16px 18px 30px;position:relative;overflow:hidden}
  header.top::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 14px,transparent 14px 34px),repeating-linear-gradient(65deg,rgba(224,165,38,.10) 0 10px,transparent 10px 40px);pointer-events:none}
  .tape{position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--saffron);background-image:repeating-linear-gradient(90deg,rgba(43,36,32,.75) 0 1.5px,transparent 1.5px 8px),repeating-linear-gradient(90deg,rgba(43,36,32,.9) 0 2px,transparent 2px 40px);background-size:100% 6px,100% 11px;background-repeat:no-repeat;background-position:0 0,0 0}
  .brand{display:flex;align-items:center;justify-content:space-between;position:relative}
  .logo{font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:-.02em}
  .logo .mk{width:34px;height:34px;border-radius:11px;background:var(--saffron);display:flex;align-items:center;justify-content:center;font-size:19px}
  .logo small{font-size:12px;font-weight:700;background:rgba(255,255,255,.18);padding:3px 8px;border-radius:99px;letter-spacing:.06em}
  .aistat{font-size:12px;font-weight:700;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.15);position:relative}
  main{flex:1;padding:16px 16px 110px}
  h1{font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-.02em}
  h2{font-size:18px;font-weight:800;margin:20px 0 10px;letter-spacing:-.01em}
  h3{font-size:15.5px;font-weight:700}
  .muted{color:var(--muted);font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
  .row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:14px;padding:14px;font:700 15px Inter,sans-serif;cursor:pointer;background:var(--plum);color:#fff;text-align:center;text-decoration:none}
  .btn.ink{background:var(--ink)}.btn.saff{background:var(--saffron);color:var(--ink)}.btn.light{background:var(--plumL);color:var(--plum)}.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}.btn.teal{background:var(--teal)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sm{padding:9px 12px;font-size:13.5px;width:auto;border-radius:11px}
  .hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:-28px;position:relative;box-shadow:0 10px 30px rgba(110,31,69,.10)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .stat{background:var(--bg);border-radius:14px;padding:10px;text-align:center}
  .stat b{display:block;font-size:22px;font-weight:800;color:var(--plum)}
  .stat span{font-size:12px;color:var(--muted);font-weight:600}
  .feat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fe{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer}
  .fe .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:10px}
  .ava{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none;font-size:16px;overflow:hidden}
  .ava img{width:100%;height:100%;object-fit:cover}
  .tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;margin:4px 4px 0 0;background:var(--bg);color:var(--muted)}
  .t-plum{background:var(--plumL);color:var(--plum)}.t-saff{background:var(--saffL);color:#93670A}.t-teal{background:var(--tealL);color:var(--teal)}.t-red{background:var(--redL);color:var(--red)}
  nav{position:fixed;bottom:0;width:100%;max-width:440px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 6px 14px;z-index:5}
  nav button{background:none;border:none;color:#A39689;font:600 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 6px;min-width:60px}
  nav button.on{color:var(--plum)}
  nav button{min-width:50px;padding:4px 2px;font-size:10.5px}
  .chips button{white-space:nowrap;flex:none}
  .cat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .mc{position:relative;border-radius:18px;overflow:hidden;background:#EFE7DC;aspect-ratio:3/4.3;cursor:pointer;box-shadow:0 2px 10px rgba(43,36,32,.08)}
  .mc img{width:100%;height:100%;object-fit:cover;display:block}
  .mc .mi{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 9px;background:linear-gradient(transparent,rgba(30,20,16,.78));color:#fff;display:flex;flex-direction:column}
  .mc .mi b{font-size:15px}.mc .mi span{font-size:11.5px;opacity:.85}
  .mc .del{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer}
  .strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .strip img{width:92px;height:128px;object-fit:cover;border-radius:14px;flex:none;cursor:pointer}
  .tryon{border-radius:20px;overflow:hidden;background:#EFE7DC;text-align:center;margin-top:8px}
  .tryon img{width:100%;display:block}
  img.mini{width:44px;height:56px;object-fit:cover;border-radius:10px;border:2px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .tl{margin:8px 0 0 18px}.tl li{margin:4px 0}
  textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;font:500 14px Inter,sans-serif;background:var(--card);color:var(--ink);resize:vertical}
  select{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;font:600 14px Inter,sans-serif;background:var(--card);color:var(--ink)}
  nav svg{width:23px;height:23px}
  nav .fab{width:60px;height:60px;border-radius:20px;background:linear-gradient(135deg,var(--plum),var(--plum2));color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 10px 24px rgba(110,31,69,.4);font-size:28px}
  .back{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:19px;cursor:pointer;color:var(--ink)}
  .steps{display:flex;gap:6px;margin:12px 0 16px}
  .steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
  .steps i.on{background:var(--plum)}
  label.f{font-size:12px;font-weight:700;color:var(--muted);display:block;margin:14px 0 7px;text-transform:uppercase;letter-spacing:.07em}
  input[type=text],input[type=tel],input[type=number],input[type=date],textarea,select{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font:500 15px Inter,sans-serif;color:var(--ink);margin-bottom:8px}
  .seg{display:flex;background:#EBE3D8;border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;border:none;background:none;border-radius:9px;padding:10px 4px;font:600 13.5px Inter,sans-serif;cursor:pointer;color:var(--ink)}
  .seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.08);color:var(--plum)}
  .photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ph{aspect-ratio:3/5;border:2px dashed #CDBFAF;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;background:var(--card);font-weight:700;color:var(--muted);font-size:13.5px;text-align:center;gap:8px;padding:10px}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ph input{display:none}
  .ph .lbl{position:absolute;left:8px;top:8px;background:rgba(43,36,32,.75);color:#fff;font-size:11.5px;padding:3px 8px;border-radius:99px;z-index:2}
  .tips{background:var(--saffL);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.55;margin-top:12px}
  .mark{position:relative;width:100%;border-radius:16px;overflow:hidden;background:#222;touch-action:none;user-select:none;-webkit-user-select:none}
  .mark img{display:block;width:100%;height:auto;pointer-events:none}
  .pt{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.35);pointer-events:none}
  .pt b{position:absolute;left:24px;top:-2px;font-size:11px;color:#fff;background:rgba(43,36,32,.8);padding:1px 6px;border-radius:6px;white-space:nowrap}
  .hline{position:absolute;height:2px;background:var(--saffron);pointer-events:none;transform-origin:0 50%}
  .ask{background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;margin:10px 0;display:flex;gap:10px;align-items:center}
  .ask .n{background:var(--saffron);color:var(--ink);border-radius:9px;font-weight:800;padding:4px 9px;font-size:13px}
  table.m{width:100%;border-collapse:collapse;background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
  table.m td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
  table.m tr:last-child td{border-bottom:none}
  table.m input{width:84px;margin:0;padding:7px 9px;text-align:right;font-weight:700}
  .src{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .ai-load{text-align:center;padding:30px 10px}
  .scan{width:150px;height:240px;margin:0 auto 16px;border-radius:18px;position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line)}
  .scan img{width:100%;height:100%;object-fit:cover;opacity:.85}
  .scan::after{content:'';position:absolute;left:0;right:0;height:3px;background:var(--saffron);box-shadow:0 0 14px var(--saffron);animation:scan 1.6s ease-in-out infinite alternate;top:0}
  @keyframes scan{to{top:calc(100% - 3px)}}
  .garm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .gm{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center;cursor:pointer}
  .gm.on{border-color:var(--plum);background:var(--plumL)}
  .gm .e{font-size:30px}
  .svgbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;overflow:auto}
  .svgbox svg{display:block;max-width:100%;max-height:440px;width:auto;height:auto;margin:0 auto}
  .svgbox.wide svg{width:100%;max-height:none}
  .piece{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .piece:last-child{border-bottom:none}
  .big{font-size:34px;font-weight:800;color:var(--plum);letter-spacing:-.02em}
  .ord{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;border-left:5px solid var(--saffron)}
  .pipe{display:flex;gap:4px;margin-top:10px}
  .pipe button{flex:1;border:none;border-radius:9px;padding:8px 2px;font:700 11px Inter,sans-serif;cursor:pointer;background:var(--bg);color:var(--muted)}
  .pipe button.on{background:var(--plum);color:#fff}
  .pipe button.done{background:var(--plumL);color:var(--plum)}
  .chat{display:flex;flex-direction:column;gap:10px}
  .msg{max-width:86%;padding:11px 14px;border-radius:16px;line-height:1.5;font-size:14.5px;white-space:pre-wrap}
  .msg.me{align-self:flex-end;background:var(--plum);color:#fff;border-bottom-right-radius:5px}
  .msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 12px;font:600 12.5px Inter,sans-serif;cursor:pointer;color:var(--ink);text-align:left}
  .composer{position:fixed;bottom:76px;width:100%;max-width:440px;padding:8px 12px;background:linear-gradient(180deg,rgba(244,238,230,0),var(--bg) 30%);display:flex;gap:8px;z-index:4}
  .composer input{margin:0;border-radius:99px;padding:13px 16px}
  .composer button{border:none;background:var(--plum);color:#fff;border-radius:99px;width:48px;flex:none;font-size:19px;cursor:pointer}
  .overlay{position:fixed;inset:0;background:rgba(43,36,32,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .overlay.show{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:20px 16px 24px;max-height:92vh;overflow-y:auto;animation:up .22s ease}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:20;display:none;max-width:90%;text-align:center}
  .toast.show{display:block;animation:up .2s}
  .warn{background:var(--redL);color:#7E2A1C;border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.5}
  .note{background:var(--tealL);color:#164F4A;border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.5}
  .steplist{counter-reset:s}
  .steplist div{counter-increment:s;padding:10px 0 10px 40px;position:relative;border-bottom:1px solid var(--line);line-height:1.5;font-size:14px}
  .steplist div::before{content:counter(s);position:absolute;left:0;top:9px;width:28px;height:28px;border-radius:9px;background:var(--plumL);color:var(--plum);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
  .steplist div:last-child{border-bottom:none}
</style>
</head>
<body>
<div class="phone" id="app"></div>
<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ===================== МАЪЛУМОТ ===================== */
const ML={ // андозаҳо
  height:'Қад',neck:'Гардан (давра)',shoulder:'Бари китф',chest:'Сина (давра)',waist:'Миён (давра)',hips:'Сурин (давра)',
  arm:'Дарозии остин',bicep:'Бозу (давра)',wrist:'Банди даст',back:'Дарозии пушт то миён',front:'Дарозии пеш то миён',
  belly:'Шикам (давра)',inseam:'Шим — дарозии дарунӣ',outseam:'Шим — дарозии берунӣ',thigh:'Рон (давра)',pocha:'Почаи шим (давра)'};
const MKEYS=Object.keys(ML);
const GARM={
  skirt:{n:'Доман',e:'👗',d:'доман тӯғрӣ бо камарбанд',need:['waist','hips']},
  pants:{n:'Шим',e:'👖',d:'шими классикӣ',need:['waist','hips','inseam','outseam','thigh','pocha']},
  kurta:{n:'Куртаи занона',e:'🥻',d:'куртаи миллӣ, тӯғрӣ, бо остин',need:['neck','shoulder','chest','arm','bicep','wrist','back']},
  dress:{n:'Либос аз рӯи модел',e:'👘',d:'либоси дароз аз каталог',need:['neck','shoulder','chest','arm','bicep','wrist','back','hips']},
  shirt:{n:'Куртаи мардона',e:'👔',d:'курта бо гиребон ва сардаст',need:['neck','shoulder','chest','arm','bicep','wrist','back']}
};
const FABRICS=[{w:50,n:'Атлас / адрас (50 см)'},{w:90,n:'90 см'},{w:110,n:'110 см'},{w:150,n:'150 см'}];
const STAGES=['Қабул','Бурида','Дӯхта','Тайёр','Супорида'];
const COLORS=['#A3305F','#1F7A72','#C27A1A','#5B4BB7','#2B6CB0','#B0412D'];
const FRONT_PTS=[['head','Нӯги сар'],['heel','Поёни пошна'],['neck','Пойгоҳи гардан (марказ)'],['shL','Нӯги китфи чап'],['shR','Нӯги китфи рост'],['chL','Сина — канори чап'],['chR','Сина — канори рост'],['waL','Миён — канори чап'],['waR','Миён — канори рост'],['hiL','Сурин — канори чап'],['hiR','Сурин — канори рост'],['wrist','Банди дасти рост'],['crotch','Байни ронҳо (қадам)']];
const SIDE_PTS=[['head','Нӯги сар'],['heel','Поёни пошна'],['chF','Сина — пеш'],['chB','Сина — пушт'],['waF','Миён — пеш'],['waB','Миён — пушт'],['hiF','Сурин — пеш'],['hiB','Сурин — пушт']];

let S=load()||{clients:[],orders:[],seam:1.5};
let tab='home',view=null,cur=null,M=null,P=null,chat=[],AI=null,AIimg=false,DL=null;
function load(){try{const r=localStorage.getItem('darzi');return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem('darzi',JSON.stringify(S))}catch(e){toast('Хотира пур аст — баъзе аксҳоро нест кунед')}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('show'),2800)}
function openSheet(h){document.getElementById('sheet').innerHTML=h;document.getElementById('ov').classList.add('show')}
function closeSheet(){document.getElementById('ov').classList.remove('show')}
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeSheet()});
const uid=()=>Math.random().toString(36).slice(2,9);
const C=id=>S.clients.find(c=>c.id===id);
const r1=v=>Math.round(v*10)/10, r0=v=>Math.round(v);
function lastM(c){return c&&c.meas&&c.meas.length?c.meas[c.meas.length-1]:null}
function ava(c,s){const col=COLORS[(c.name.charCodeAt(0)||0)%COLORS.length];const m=lastM(c);return `<div class="ava" style="background:${col};${s?`width:${s}px;height:${s}px;border-radius:${s/3.2}px`:''}">${m&&m.thumb?`<img src="${m.thumb}" alt="">`:esc(c.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</div>`}
function fmtDate(t){const d=new Date(t);return d.toLocaleDateString('ru-RU')}

/* ===================== ЗС (Claude) ===================== */
/* ЗС: дар Claude — Claude; дар APK / сайт — сервери худ (Cloudflare + Gemini) */
let AIKIND=null;
function remoteAI(url){
  const toB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
  async function call(input,opts,mode){
    opts=opts||{};const images=opts.images?await Promise.all(opts.images.map(toB64)):[];
    const body={mode,images};if(typeof input==='string')body.prompt=input;else body.messages=input;
    const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),90000);
    let r;try{r=await fetch(url.replace(/\/$/,'')+'/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal})}
    catch(e){throw {code:'network',message:'Пайваст нашуд'}}finally{clearTimeout(t)}
    if(r.status===429)throw {code:'rate_limited'};
    const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw {code:'server',message:j.error||('HTTP '+r.status)};
    if(opts.onText)opts.onText({text:j.text,delta:j.text});return {text:j.text||''};
  }
  const f=(input,opts)=>call(input,opts,'text');
  f.json=async(input,opts)=>{const o=await call(input,opts,'json');const t=o.text;return JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1))};
  f.image=async(prompt,opts)=>{const images=await Promise.all((opts.images||[]).map(toB64));
    const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),120000);let r;

const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function ellipseC(w,d){const a=w/2,b=d/2;return Math.PI*(3*(a+b)-Math.sqrt((3*a+b)*(a+3*b)))}
function fromPoints(H,gender,fp,sp){
  const sF=H/Math.abs(fp.heel.y-fp.head.y);
  const sS=sp?H/Math.abs(sp.heel.y-sp.head.y):null;
  const w=(a,b)=>Math.abs(fp[b].x-fp[a].x)*sF;
  const chestW=w('chL','chR'),waistW=w('waL','waR'),hipW=w('hiL','hiR');
  const dep=(a,b,ratio,width)=>sp?Math.abs(sp[b].x-sp[a].x)*sS:width*ratio;
  const chestD=dep('chF','chB',0.72,chestW),waistD=dep('waF','waB',0.78,waistW),hipD=dep('hiF','hiB',0.8,hipW);
  const m={height:H};
  m.chest=ellipseC(chestW,chestD);m.waist=ellipseC(waistW,waistD);m.hips=ellipseC(hipW,hipD);
  m.shoulder=dist(fp.shL,fp.shR)*sF;
  m.arm=dist(fp.shR,fp.wrist)*sF+1;
  const waY=(fp.waL.y+fp.waR.y)/2;
  m.back=(waY-fp.neck.y)*sF+1.5;
  m.front=m.back+(gender==='f'?3:1.5);
  m.inseam=Math.abs(fp.heel.y-fp.crotch.y)*sF;
  m.outseam=Math.abs(fp.heel.y-waY)*sF;
  // аз таносуб
  m.neck=m.chest*(gender==='f'?0.36:0.39);
  m.bicep=m.chest*0.31;
  m.wrist=H*(gender==='f'?0.093:0.103);
  m.thigh=m.hips*0.59;
  m.pocha=m.thigh*0.72;
  const src={};MKEYS.forEach(k=>src[k]='photo');['neck','bicep','wrist','thigh','pocha'].forEach(k=>src[k]='ratio');src.height='input';
  if(!sp){['chest','waist','hips'].forEach(k=>src[k]='photo1')}
  MKEYS.forEach(k=>m[k]=r1(m[k]));
  return {m,src};
}

    pcs.push({n:'Камарбанд',cnt:1,fold:false,pts:[[0,0],[m.waist+4,0],[m.waist+4,8],[0,8]],note:'дарозӣ миён + 4 см'});

  }

      const W2=front?m.hips/4-1:m.hips/4+1,ext=front?m.hips/20+0.5:m.hips/10,wt=front?m.waist/4+1:m.waist/4+3;
      const kw=front?knee/2-1:knee/2+1,hw=front?m.pocha/2-1:m.pocha/2+1;
      const xc=(ext+W2)/2,ky=rise+(Lp-rise)/2-5;
      return [[ext+(front?0.5:2),0],[ext+wt,0],[ext+W2,18],[ext+W2,rise],[xc+kw/2,ky],[xc+hw/2,Lp],[xc-hw/2,Lp],[xc-kw/2,ky],[0,rise],[ext*0.3,rise-2],[ext,rise-7]];
    };
    pcs.push({n:'Пеши шим',cnt:2,fold:false,pts:mk(true),note:'ҷуфт (чапу рост)'});

  }else{

  }
  pcs.push({n:'Пушт',cnt:1,fold:true,pts:body(2,0),note:'дар қат'});
  const cap=AD-4.5,sw=m.bicep+(men?7:6),bw=m.wrist+(men?2:12),al=+opt.sleeve||m.arm;
  pcs.push({n:'Остин',cnt:2,fold:false,pts:[[0,cap],[sw*0.12,cap*0.7],[sw*0.25,cap*0.32],[sw*0.38,cap*0.08],[sw/2,0],[sw*0.62,cap*0.08],[sw*0.75,cap*0.32],[sw*0.88,cap*0.7],[sw,cap],[sw-(sw-bw)/2,al],[(sw-bw)/2,al]],note:`дарозӣ ${r1(al)} см`});
  if(men){

function bbox(pts){const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);return{x0:Math.min(...xs),y0:Math.min(...ys),x1:Math.max(...xs),y1:Math.max(...ys)}}
function layout(pcs,FW,s){
  // ҳар порча бо кромка; порчаҳои «дар қат» кушода ҳисоб мешаванд
  const items=[];let split=false;
  pcs.forEach(p=>{const b=bbox(p.pts);let w=(b.x1-b.x0)*(p.fold?2:1)+2*s,h=(b.y1-b.y0)+2*s+(['Пеш','Пушт','Пеши шим','Пушти шим'].includes(p.n)?2.5:0);
    for(let i=0;i<p.cnt;i++){
      if(w>FW-2){const parts=Math.ceil(w/(FW-2-2*s));split=true;for(let k=0;k<parts;k++)items.push({n:p.n+' ('+(k+1)+'/'+parts+')',w:w/parts+2*s,h})}
      else items.push({n:p.n,w,h});
    }});
  items.sort((a,b)=>b.h-a.h);
  let x=0,y=0,shelf=0;const placed=[];
  items.forEach(it=>{if(x+it.w>FW){x=0;y+=shelf;shelf=0}placed.push({...it,x,y});x+=it.w;shelf=Math.max(shelf,it.h)});

}

  }
}

async function saveSVG(){
  const c=C(P.cid),m=lastM(c).m,pcs=pDraft(m),L=layout(pcs,P.fw,S.seam);

  let x=0,parts='',maxH=0;pcs.forEach(p=>{const b=bbox(p.pts);const w=b.x1-b.x0+12,h=b.y1-b.y0+18;parts+=`<g transform="translate(${r1(x)} 0)">${pieceSVG(p,S.seam).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'').replace('<rect width="100%" height="100%" fill="#FFFDF9"/>','')}</g>`;x+=w+4;maxH=Math.max(maxH,h)});
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${r1(x)}cm" height="${r1(maxH)}cm" viewBox="0 0 ${r1(x)} ${r1(maxH)}">${parts}</svg>`;
  const fn=`qolib-${GARM[P.g].n.replace(/\s/g,'_')}-${c.name.replace(/\s/g,'_')}.svg`;
  try{
    if(window.AndroidBridge){AndroidBridge.share(fn,svg);return}
    if(DL){await DL.save({filename:fn,data:new Blob([svg],{type:'image/svg+xml'})});toast('Захира шуд ✓');return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download=fn;document.body.appendChild(a);a.click();a.remove();toast('Файл захира шуд ✓');
  }catch(e){toast('Захира нашуд')}
}

/* --- андозаҳо аз 4 рақами дастӣ --- */
function fromClient(v){
  const H=+v.H,ch=+v.chest,wa=+v.waist,be=+v.belly;
  const hips=+v.hips||r1(Math.max(ch*1.07,be*1.12,wa*1.2));
  const m={height:H,chest:ch,waist:wa,belly:be,hips,neck:r1(ch*0.37),shoulder:+v.shoulder||r1(ch*0.41),arm:+v.arm||r1(H*0.35),
    bicep:r1(ch*0.31),wrist:r1(H*0.095),back:r1(H*0.245),front:r1(H*0.27),inseam:r1(H*0.45),outseam:r1(H*0.62)};
  m.thigh=r1(hips*0.59);m.pocha=r1(m.thigh*0.72);
  const src={};MKEYS.forEach(k=>src[k]='ratio');['height','chest','waist','belly'].forEach(k=>src[k]='input');
  ['hips','shoulder','arm'].forEach(k=>{if(+v[k])src[k]='input'});
  return {m,src};
}
function dressLen(H,len){return r0(H*({mini:0.53,midi:0.66,maxi:0.82}[len]||0.82))}

/* --- қолиби либос --- */
function draftDress(m,opt){
  const L=+opt.len,cut=opt.cut||'aline',sl=opt.sl||'long',pcs=[];
  const big=Math.max(m.chest,m.belly||0);
  const B=big/4+3.5,AD=m.chest/10+10.5,NW=m.neck/6+0.5,NDf=NW+2.5,sh=m.shoulder/2;
  const hipY=Math.min(L-5,m.back+20),hipW=Math.max(B,m.hips/4+2);
  const hem=hipW+({straight:2,aline:L*0.16,wide:L*0.32}[cut]||L*0.16);
  const body=nd=>[[0,nd],[NW*0.5,nd*0.88],[NW*0.85,nd*0.5],[NW,0],[sh,4],[sh-0.7,AD*0.38],[sh-0.9,AD*0.66],[sh+(B-sh)*0.35,AD*0.93],[B,AD],[B,AD+6],[hipW,hipY],[hem,L],[0,L]];
  pcs.push({n:'Пеш',cnt:1,fold:true,pts:body(NDf),note:`дар қат · гиребон ${r1(NDf)} см · поён ${r1(hem*2)} см`});
  pcs.push({n:'Пушт',cnt:1,fold:true,pts:body(2),note:`дар қат · зиппер 50 см`});
  const cap=AD-4.5,sw=m.bicep+6;
  if(sl==='puff'){const pw=sw*1.5,pl=26;
    pcs.push({n:'Остини пуф',cnt:2,fold:false,pts:[[0,cap+4],[pw*0.15,cap*0.55],[pw*0.32,cap*0.12],[pw/2,0],[pw*0.68,cap*0.12],[pw*0.85,cap*0.55],[pw,cap+4],[pw*0.92,pl+cap],[pw*0.08,pl+cap]],note:'болояш чин мешавад'});
    pcs.push({n:'Банди остин',cnt:2,fold:false,pts:[[0,0],[m.bicep+4,0],[m.bicep+4,6],[0,6]],note:'бозу + 4 см'});
  }else{
    const al=sl==='short'?24:+opt.sleeve||m.arm,bw=sl==='wide'?sw*1.7:sl==='short'?sw*0.95:m.wrist+12;
    const d=(sw-bw)/2;
    pcs.push({n:sl==='wide'?'Остини васеъ':'Остин',cnt:2,fold:false,pts:[[0,cap],[sw*0.12,cap*0.7],[sw*0.25,cap*0.32],[sw*0.38,cap*0.08],[sw/2,0],[sw*0.62,cap*0.08],[sw*0.75,cap*0.32],[sw*0.88,cap*0.7],[sw,cap],[sw-d,al],[d,al]].map(p=>[p[0]+Math.max(0,-d),p[1]]),note:`дарозӣ ${r1(al)} см`});
  }
  pcs.push({n:'Рӯяи гиребон',cnt:1,fold:true,pts:[[0,0],[NW+4,0],[NW+4,NDf+4],[0,NDf+4]],note:'дар қат'});
  return pcs;
}
function draftModel(md,m,o){
  o=o||{};
  if(md.cut==='set'){const k=draft('kurta',m,{len:o.len||r0(m.height*0.6),sleeve:o.sleeve}),p=draft('pants',m,{len:m.outseam});return [...k,...p.map(x=>({...x,n:x.n}))]}
  return draftDress(m,{len:o.len||dressLen(m.height,md.len),cut:o.cut||md.cut,sl:o.sl||md.sl,sleeve:o.sleeve});
}

/* пешнамоиши офлайн: силуэти модел бо матои шумо */
function localPreview(){return new Promise(res=>{
  const x=MD(T.model),W=600,H=800,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const fab=new Image();fab.onload=()=>{
    const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#FBF6EF');bg.addColorStop(1,'#EADFD1');g.fillStyle=bg;g.fillRect(0,0,W,H);
    // манекен
    g.fillStyle='#CDBBA6';g.beginPath();g.ellipse(300,70,34,40,0,0,7);g.fill();g.fillRect(288,104,24,26);
    const cx=300,top=128,sh=78,cw=70,ww=58,hy={mini:470,midi:600,maxi:740}[x.len]||740,hem={straight:92,aline:150,wide:215,set:100}[x.cut]||150;
    const path=new Path2D();
    path.moveTo(cx-26,top);path.quadraticCurveTo(cx,top+22,cx+26,top);path.lineTo(cx+sh,top+16);path.lineTo(cx+cw,top+120);path.quadraticCurveTo(cx+ww-4,top+190,cx+ww,top+215);
    path.quadraticCurveTo(cx+hem*0.75,(top+215+hy)/2,cx+hem,hy);path.quadraticCurveTo(cx,hy+18,cx-hem,hy);path.quadraticCurveTo(cx-hem*0.75,(top+215+hy)/2,cx-ww,top+215);
    path.quadraticCurveTo(cx-ww+4,top+190,cx-cw,top+120);path.lineTo(cx-sh,top+16);path.closePath();
    const sleeve=s=>{const p=new Path2D(),d=s;const sl=x.sl;
      if(sl==='puff'){p.moveTo(cx+d*sh,top+16);p.bezierCurveTo(cx+d*(sh+70),top-6,cx+d*(sh+70),top+110,cx+d*(sh+18),top+118);p.lineTo(cx+d*(cw-2),top+110);p.closePath();return p}
      const ln=sl==='short'?150:top+330,wE=sl==='wide'?95:sl==='short'?48:36;
      p.moveTo(cx+d*sh,top+16);p.lineTo(cx+d*(sh+30+(sl==='wide'?40:0)),sl==='short'?top+150:ln);p.lineTo(cx+d*(sh+30+(sl==='wide'?40:0)-wE),sl==='short'?top+150:ln+8);p.lineTo(cx+d*(cw-4),top+118);p.closePath();return p};
    const pat=g.createPattern((()=>{const t=document.createElement('canvas'),k=260/Math.max(fab.width,fab.height);t.width=fab.width*k;t.height=fab.height*k;t.getContext('2d').drawImage(fab,0,0,t.width,t.height);return t})(),'repeat');
    [sleeve(-1),sleeve(1),path].forEach(p=>{g.save();g.shadowColor='rgba(0,0,0,.18)';g.shadowBlur=18;g.fillStyle=pat;g.fill(p);g.restore();
      const sh2=g.createLinearGradient(cx-hem,0,cx+hem,0);sh2.addColorStop(0,'rgba(0,0,0,.22)');sh2.addColorStop(.35,'rgba(255,255,255,.05)');sh2.addColorStop(.55,'rgba(255,255,255,.12)');sh2.addColorStop(1,'rgba(0,0,0,.25)');g.fillStyle=sh2;g.fill(p);g.strokeStyle='rgba(43,36,32,.35)';g.lineWidth=1.5;g.stroke(p)});
    // пояи манекен
    if(x.len!=='maxi'){g.fillStyle='#8C7A66';g.fillRect(296,hy+10,8,H-hy-50);g.fillRect(250,H-42,100,8)}
    g.fillStyle='rgba(43,36,32,.7)';g.font='600 18px Inter,Arial';g.textAlign='center';g.fillText('Пешнамоиши тахминӣ · '+x.n,W/2,H-12);
    res(cv.toDataURL('image/jpeg',.85));
  };fab.onerror=()=>res(null);fab.src=T.fab.url;
})}

function imgBlob(src){if(src.startsWith('data:'))return Promise.resolve(dataUrlToBlob(src));
  return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);try{res(dataUrlToBlob(c.toDataURL('image/jpeg',.85)))}catch(e){rej(e)}};im.onerror=rej;im.src=src})}
async function tAdvice(){
  const x=MD(T.model),m=tMeas();T.advice='…';render();
  const prompt=`${infoCtx()}Ту устои ботаҷрибаи дӯзандаи либоси занонаи тоҷикӣ ҳастӣ. Се акс: 1) мизоҷ, 2) модели либос «${x.n}» (${x.d}; ${CUTS[x.cut]}, ${LENS[x.len]}, ${SLS[x.sl]}), 3) матои мизоҷ.
Андозаҳо (см): қад ${m.height}, сина ${m.chest}, миён ${m.waist}, шикам ${m.belly}, сурин (тахминӣ) ${m.hips}.
Ба забони тоҷикӣ (кириллӣ), кӯтоҳ ва самимӣ баҳо деҳ: ин модел аз ин матоъ ба ин мизоҷ чӣ тавр менишинад; матоъ ба модел мувофиқ аст ё не (ғафсӣ, нақш, самти нақш); чӣ тағйир додан беҳтар аст (дарозӣ, остин, камар). Агар дар акс одам ё матоъ намоён набошад, ростқавлона бигӯ.
Танҳо JSON: {"fit":"2–3 ҷумла","fabric":"1–2 ҷумла","tips":["...","...","..."]}`;
  try{const imgs=[dataUrlToBlob(T.me.url),await imgBlob(x.img),dataUrlToBlob(T.fab.url)];
    const o=AIimg?await AI.json(prompt,{images:imgs,modelTier:'default'}):await AI.json(prompt.replace('Се акс:','Аксҳо нестанд, танҳо тавсиф:'),{modelTier:'default'});
    T.advice={fit:o.fit||'',fabric:o.fabric||'',tips:Array.isArray(o.tips)?o.tips.slice(0,5):[]};
  }catch(e){T.advice=null;toast(e&&e.code==='rate_limited'?'ЗС банд аст — баъдтар':'Маслиҳати ЗС гирифта нашуд')}
  render();
}
async function tImage(){
  if(!(AI&&AI.image)){toast('Барои акс сервери ЗС лозим (⚙️)');return}
  const x=MD(T.model),m=tMeas();T.busy=true;T.imgErr='';render();
  const ar=T.me.w/T.me.h,RT=[['9:16',9/16],['2:3',2/3],['3:4',3/4],['4:5',4/5],['1:1',1],['5:4',5/4],['4:3',4/3],['3:2',3/2],['16:9',16/9]];
  const aspect=RT.reduce((b,r)=>Math.abs(r[1]-ar)<Math.abs(b[1]-ar)?r:b)[0];
  const prompt=`PHOTO EDITING TASK (virtual try-on). Do NOT create a new person or a new photo.
Edit the FIRST image (the customer's own photo). Keep EVERYTHING in it exactly the same: the same person, face, facial features, hair, head covering, skin tone, hands, body shape and size, pose, camera angle, framing, background and lighting.
Change ONLY the clothing: replace what the customer is wearing with the dress design shown in the second image, sewn from the fabric shown in the third image.
The customer's body measurements: height ${m.height} cm, chest ${m.chest} cm, waist ${m.waist} cm, belly ${m.belly} cm — the dress must fit THIS body, not the body of the reference model.`;
  const labels=['IMAGE 1 — the customer\'s photo. THIS is the photo to edit. Keep this person and this background.',
    `IMAGE 2 — dress design reference "${x.n}" (${x.d}; ${x.cut==='wide'?'wide full skirt':x.cut==='straight'?'straight fitted cut':'A-line cut'}, ${x.len==='maxi'?'floor length':x.len==='midi'?'mid-calf length':'knee length'}, ${({long:'long sleeves',wide:'wide flared sleeves',puff:'puff sleeves',short:'short sleeves'})[x.sl]}). Copy ONLY the garment's cut, silhouette, sleeves and decoration. IGNORE the person, mannequin, face and background in this image.`,
    'IMAGE 3 — the customer\'s fabric. Use its colours and pattern for the dress, at a realistic scale.'];
  const final='Return one edited photo: the same person from IMAGE 1, same pose and background, now wearing the new dress. No text, no collage, no second person.';
  try{const r=await AI.image(prompt,{images:[dataUrlToBlob(T.me.url),await imgBlob(x.img),dataUrlToBlob(T.fab.url)],labels,final,aspect});T.img=r.image;T.show='after'}
  catch(e){T.imgErr=e&&e.code==='image_quota'?'Сервер акс сохта натавонист: модели акси Gemini калиди пулакӣ (billing) мехоҳад ё лимит тамом шуд.':e&&e.code==='network'?'Интернет нест.':'Акс сохта нашуд: '+((e&&e.message)||'хато')}
  T.busy=false;render();
}
function tryResult(x){
  const m=tMeas();if(!T.len)T.len=x.cut==='set'?r0(m.height*0.6):dressLen(m.height,x.len);
  const pcs=draftModel(x,m,{len:T.len}),L=layout(pcs,T.fw,S.seam);
  const canImg=!!(AI&&AI.image);
  let h=`<h1>Натиҷа</h1>
  ${T.img?`<div class="seg" style="margin-top:8px"><button class="${T.show!=='before'?'on':''}" onclick="T.show='after';render()">✨ Баъд</button><button class="${T.show==='before'?'on':''}" onclick="T.show='before';render()">📷 Пеш</button></div>`:''}
  <div class="tryon">${T.img?`<img src="${T.show==='before'?T.me.url:T.img}" alt="Либос бар шумо">`:T.busy?`<div class="ai-load" style="padding:30px 10px"><div class="scan"><img src="${T.me.url}" alt=""></div><p class="muted">✨ ЗС либосро бар шумо «мепӯшонад»… (то 1 дақиқа)</p></div>`:T.preview?`<img src="${T.preview}" alt="Пешнамоиш">`:'<p class="muted" style="padding:40px">…</p>'}</div>
  <div class="row" style="gap:6px;margin-top:8px"><img class="mini" src="${T.me.url}" alt=""><img class="mini" src="${x.img}" alt=""><img class="mini" src="${T.fab.url}" alt=""><span class="muted" style="font-size:12px;flex:1">шумо + модел + матоъ</span></div>
  ${T.img?`<p class="muted" style="font-size:12px;margin-top:6px">Акси ЗС — тасаввури тахминӣ; либоси воқеӣ метавонад каме фарқ кунад.</p>`:''}
  ${T.imgErr?`<div class="warn" style="margin-top:8px">${esc(T.imgErr)}<br><span style="font-weight:500">Ҳоло пешнамоиши тахминӣ нишон дода шуд.</span></div>`:''}
  ${!T.img&&!T.busy?(canImg?`<button class="btn" style="margin-top:10px" onclick="tImage()">✨ Сохтани акс: либос бар ман</button>`:`<div class="note" style="margin-top:10px">Ин <b>пешнамоиши тахминӣ</b> аст: шакли модел бо матои шумо. Барои акси воқеии «либос бар шумо» дар ⚙️ сервери ЗС-ро пайваст кунед.</div>`):''}
  ${T.img?`<button class="btn ghost" style="margin-top:8px" onclick="T.img=null;render()">↺ Пешнамоиши оддӣ</button>`:''}`;
  if(AI){h+=`<h2>Маслиҳати ЗС</h2>${T.advice==='…'?`<div class="card"><p class="muted">✨ ЗС аксҳоро меомӯзад…</p></div>`:T.advice?`<div class="card"><p>${esc(T.advice.fit)}</p>${T.advice.fabric?`<p style="margin-top:8px">🧵 ${esc(T.advice.fabric)}</p>`:''}${T.advice.tips.length?`<ul class="tl">${T.advice.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}</div>`:`<button class="btn light" onclick="tAdvice()">✨ Маслиҳат гирифтан</button>`}`}
  h+=`<h2>Андозаҳои буриш</h2>
  <div class="row" style="gap:8px"><div style="flex:1"><label class="f" style="margin-top:0">Дарозии либос, см</label><input type="number" value="${T.len}" onchange="T.len=+this.value;render()"></div><div style="flex:1"><label class="f" style="margin-top:0">Бари матоъ</label><select onchange="T.fw=+this.value;render()">${FABRICS.map(f=>`<option value="${f.w}" ${T.fw===f.w?'selected':''}>${f.n}</option>`).join('')}</select></div></div>
  <div class="card" style="margin-top:12px;text-align:center"><p class="muted">Матоъ лозим</p><div class="big">${(L.need/100).toFixed(2)} м</div><p class="muted">бари ${T.fw} см · ${L.placed.length} порча · кромка ${S.seam} см</p>${L.split?`<p class="tag t-saff" style="margin-top:8px">Матоъ танг — баъзе порчаҳо аз 2+ қисм</p>`:''}</div>
  <div class="card">${pcs.map(p=>{const b=bbox(p.pts);return `<div class="piece"><span><b>${p.n}</b> ×${p.cnt}<br><span class="muted" style="font-size:12px">${p.note}</span></span><span style="text-align:right;font-weight:700">${r1((b.x1-b.x0)*(p.fold?2:1))} × ${r1(b.y1-b.y0)}<br><span class="muted" style="font-size:12px">см${p.fold?' (кушода)':''}</span></span></div>`}).join('')}</div>
  <table class="m" style="margin-top:10px">${['height','chest','waist','belly','hips','shoulder','arm'].map(k=>`<tr><td>${ML[k]}</td><td style="text-align:right"><b>${r1(m[k])}</b> <span class="muted">см${['hips','shoulder','arm'].includes(k)&&!+T[k]?' · тахм.':''}</span></td></tr>`).join('')}</table>
  <h2>Тарҳи буриш</h2><div class="svgbox" style="max-height:460px">${layoutSVG(L,T.fw)}</div>
  <div class="row" style="margin-top:14px"><button class="btn saff" onclick="tSave(true)">📐 Қолиби пурра</button><button class="btn teal" onclick="tSave(false)">🧾 Фармоиш</button></div>`;
  return h;
}
async function tSave(toPattern){
  const x=MD(T.model),r=fromClient(T);
  let c=T.cid&&C(T.cid);
  if(!c){c=S.clients.find(c=>T.phone&&c.phone===T.phone)||S.clients.find(c=>c.name===T.name.trim());
    if(!c){c={id:uid(),name:T.name.trim(),phone:T.phone,gender:'f',created:Date.now(),meas:[]};S.clients.push(c)}
    c.meas.push({id:uid(),date:Date.now(),m:r.m,src:'client',thumb:await thumbOf(T.me.url,160)});T.cid=c.id}
  const L=layout(draftModel(x,r.m,{len:T.len}),T.fw,S.seam);
  if(!toPattern||!T.saved){
    S.orders.unshift({id:uid(),cid:c.id,g:'dress',model:x.id,len:T.len,fabric:`${x.n} · ${T.fw===50?'атлас':'бари '+T.fw} · ${(L.need/100).toFixed(2)} м`,fabImg:await thumbOf(T.fab.url,120),tryImg:T.img?await thumbOf(T.img,360):null,price:0,due:'',st:0,ts:Date.now()});
    T.saved=true;
  }
  save();
  if(toPattern){P={cid:c.id,g:'dress',model:x.id,fw:T.fw,len:T.len,sleeve:r1(r.m.arm),plan:null,planLoading:false};view='pattern';render();scrollTo(0,0);toast('Фармоиш ва андозаҳо нигоҳ дошта шуданд ✓')}
  else{view=null;tab='orders';T=null;render();scrollTo(0,0);toast('Фармоиш қабул шуд ✓ Устод ба шумо занг мезанад')}
}

/* ===================== START ===================== */
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude|usercontent/.test(location.host))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
render();
</script>
